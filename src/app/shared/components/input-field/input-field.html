<div class="field">
   <label [for]="inputId">
    {{ label }}
    @if(required) {
      <span class="required">*</span>
    }
  </label>

  <input
    [id]="inputId"
    [type]="type"
    [placeholder]="placeholder"
    [required]="required"
    [min]="min"
    [max]="max"
    [formControl]="control"
    [class.error]="error"
  />

  @if(error) {
  <div class="error-message">
    {{ error }}
  </div>
  }
</div>
