<div class="search-bar" (keydown.enter)="onSearch()">
  <div class="search-item where">
    <label>Where to?</label>
    <input
      type="text"
      placeholder="Destination"
      class="search-input"
      [(ngModel)]="location"
    />
  </div>

  <div class="search-item dates">
    <label>Dates</label>
    <div class="double-input">
      <input
        type="date"
        placeholder="Check-in"
        class="search-input"
        [min]="minCheckInInput"
        [(ngModel)]="checkInDate"
        (ngModelChange)="updateCheckOutMinDate()"
      />
      <input
        type="date"
        placeholder="Check-out"
        class="search-input"
        [min]="minCheckOutInput"
        [(ngModel)]="checkOutDate"
        [disabled]="isCheckOutDisabled"
      />
    </div>
  </div>

  <div class="search-item travelers">
    <label>Travelers</label>
    <input
      type="number"
      placeholder="Guests"
      class="search-input"
      [min]="minTravelersInput"
      [max]="maxTravelersInput"
      [(ngModel)]="numberOfGuests"
    />
  </div>

  <div class="search-item price">
    <label>Price Range</label>
    <div class="double-input">
      <input
        type="number"
        placeholder="Min"
        class="search-input"
        [min]="minPriceInput"
        [max]="maxPriceInput"
        [(ngModel)]="minPrice"
      />
      <input
        type="number"
        placeholder="Max"
        class="search-input"
        [min]="minPriceInput"
        [max]="maxPriceInput"
        [(ngModel)]="maxPrice"
      />
    </div>
  </div>

  <div class="button-group">
    <app-button color="primary" (click)="onSearch()">Search</app-button>
    <app-button color="danger" (click)="clearFilters()">Clear Filters</app-button>
  </div>
</div>
