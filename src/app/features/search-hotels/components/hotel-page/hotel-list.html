<div>
  <app-search-bar></app-search-bar>
  @if (loading()) {
    <app-loading-spinner message="Loading hotels..."></app-loading-spinner>
  }
  @else {
    <div class="hotel-cards">
    @for (hotelItem of hotels(); track hotelItem._id) {
      <app-hotel-card
        [hotel]="hotelItem"
        (cardClicked)="handleCardClick($event)"
      ></app-hotel-card>
    } @empty {
      <div class="no-hotels-banner">
        <div class="icon">🏨</div>
        <h3>No Hotels Found</h3>
        <p>Try changing or removing some filters or adjusting the search area.</p>
      </div>
    }
  </div>
  }
</div>
