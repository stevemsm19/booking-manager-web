<div class="main-container">
  <div class="buttons-container">
    <h2>Bookings</h2>
    <app-button color="secondary">Current Bookings</app-button>
    <app-button color="secondary">Past Bookings</app-button>
    <app-button color="primary">Canceled Bookings</app-button>
  </div>

  <div class="header-container">
    <h2>Current Bookings</h2>
    <div class="bookings-container">
      @for (booking of bookings(); track booking.id) {
      <app-booking-card [booking]="booking" [todayDate]="todayDate">
      </app-booking-card>
      } @empty {
      <div class="no-bookings">
        No bookings found.
        <p>Build the perfect trip</p>
        <div class="btn-started">
          <app-button color="danger" routerLink="/">Get started</app-button>
        </div>
      </div>
      }
    </div>
  </div>
</div>
