<div>
  @if (loading) {
  <p>Loading hotels...</p>
  }
  @if ((hotels$ | async)?.length == 0) {
    <div class="no-hotels-banner">
    <div class="icon">🏨</div>
    <h3>No Hotels Found</h3>
    <p>Try changing or removing some filters or adjusting the search area.</p>
  </div>
  } @else {
     <div class="hotel-cards">
    @for (hotelItem of (hotels$ | async); track hotelItem._id) {
    <app-hotel-card
      [hotel]="hotelItem"
      (cardClicked)="handleCardClick($event)"
    ></app-hotel-card>
    }
  </div>
  
  }
</div>
