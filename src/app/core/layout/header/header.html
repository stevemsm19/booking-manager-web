<header class="header" color="primary">
  <a routerLink="/">
    <span class="logo-text">SofBook</span>
  </a>

  <a routerLink="/">
    <span class="logo-short">SB</span>
  </a>

  <span class="spacer"></span>

  <div class="auth-buttons">
    @if (!isLoggedIn()) {
    <app-button color="primary" routerLink="/login">Login</app-button>
    <app-button color="secondary" routerLink="/register">Register</app-button>
    } @else {
    <app-button color="primary" routerLink="/">Profile</app-button>
    <app-button color="secondary" (click)="logout()">Logout</app-button>
    }
  </div>
</header>
