<div class="login-container">
  <h1 class="heading-title leading">Login</h1>
  <form
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
    (change)="onChange()"
    class="login-form"
  >
    <app-input-field
      inputId="email-user"
      label="Email"
      type="email"
      placeholder="Enter your email"
      [required]="true"
      [control]="getControl('email')"
      [error]="getEmailError()"
    />

    <app-input-field
      inputId="password-user"
      label="Password"
      type="password"
      placeholder="Enter your password"
      [required]="true"
      [control]="getControl('password')"
      [error]="getPasswordError()"
    />

    <app-button color="primary" type="submit">Login</app-button>

    @if(formError()){
    <app-alert type="error" [message]="formError()"></app-alert>
    }

    <span class="auth-footer">
      Don't have an account? <a href="/register">I want an account</a>
    </span>
  </form>
</div>
