<div class="login">
  <h1 class="login__title">Login</h1>
  
  <form
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
    (change)="onChange()"
    class="login__form"
  >
    <app-input-field
      inputId="email-user"
      label="Email"
      type="email"
      placeholder="Enter your email"
      [required]="true"
      [control]="getControl('email')"
      [error]="getEmailError()"
    />

    <app-input-field
      inputId="password-user"
      label="Password"
      type="password"
      placeholder="Enter your password"
      [required]="true"
      [control]="getControl('password')"
      [error]="getPasswordError()"
    />

    <app-button color="primary" type="submit">Login</app-button>

    @if(formError()){
      <app-alert type="error" [message]="formError()"></app-alert>
    }

    <span class="login__footer">
      Don’t have an account? <a class="login__footer-link" href="/auth/register">I want an account</a>
    </span>
  </form>
</div>
