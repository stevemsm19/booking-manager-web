<div class="register-container">
  <h1 class="heading-title">Register</h1>
  <form
    [formGroup]="registerForm"
    (ngSubmit)="onSubmit()"
    (change)="onChange()"
    class="register-form"
  >
    <app-input-field
      label="Email"
      type="email"
      placeholder="Enter your email"
      [required]="true"
      [control]="getControl('email')"
      [error]="getEmailError()"
    />

    <app-input-field
      label="Password"
      type="password"
      placeholder="Enter your password"
      [required]="true"
      [control]="getControl('password')"
      [error]="getPasswordError()"
    />

    <app-input-field
      label="Confirm Password"
      type="password"
      placeholder="Confirm your password"
      [required]="true"
      [control]="getControl('confirmPassword')"
      [error]="getConfirmPasswordError()"
    />

    <app-button color="primary" type="submit">Register</app-button>

    @if(formError()){
      <app-alert type="error" [message]="formError()"></app-alert>
    } @if(formMessage()){
      <app-alert type="success" [message]="formMessage()"></app-alert>
    }

    <span class="auth-footer">
      Already have an account? <a href="/auth/login">I want to log in</a>
    </span>
  </form>
</div>
